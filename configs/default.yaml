# -- Data ----------------------------------------------------------------------
num_samples: 50000              # clean samples per mesh
noise_type: laplace             # gaussian | laplace
noise_std_range: [0.005, 0.030] # coordinate std interval
noise_std_sampling: log         # linear | log
patch_size: 1024                # points per patch
num_patches: 8                  # patches per mesh item

# -- Model ----------------------------------------------------------------------
feat_dim: 192                # hidden feature width
encoder_dims: [64, 128]      # neighbor encoder widths
k_neighbors: 32              # neighbor count
num_blocks: 3                # transformer block count
alpha_dim: 16                # shared alpha feature width
ffn_ratio: 8
decoder_dims: [128, 64]

# -- Loss -----------------------------------------------------------------------
dcd_weight: 0.005            # density-aware point-set loss weight
dcd_alpha: 8000              # DCD kernel sharpness

# -- Training -------------------------------------------------------------------
train_alpha_min: 0.2         # alpha sampling lower bound
epochs: 100
batch_size: 8                # meshes per batch
lr: 0.0005
lr_min: 0.00001
warmup_epochs: 5
weight_decay: 0.0001
grad_clip: 0.5               # max grad norm; 0 disables
ema_decay: 0.999             # per-step; 0 disables
seed: 42
num_workers: 8
log_interval: 100
checkpoint_interval: 10
checkpoint_dir: checkpoints

mini_val_interval: 2         # mini-val interval; <=0 disables
mini_val_size: 50            # mini-val mesh count
mini_val_chunks: 8           # mini-val inference splits

# -- Inference ------------------------------------------------------------------
num_steps: 3                 # reverse-flow steps
alpha_clean_power: 1         # clean-end schedule exponent
alpha_noisy_power: 6         # noisy-end schedule exponent
seed_k: 24                   # inference patch density
patch_agg_beta: 5            # center vote falloff
inference_chunks: 8          # predict/eval inference splits
inference_seed: 42
